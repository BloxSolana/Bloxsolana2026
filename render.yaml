services:
  - type: web
    name: ivas-fastapi-bridge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

  - type: worker
    name: ivas-polling-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python poller.py
    
